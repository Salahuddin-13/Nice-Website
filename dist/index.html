on:"Virtual · under Prof. Sudarshan Iyengar",summary:"A 10-week virtual research internship, awarded by competitive selection through the national NPTEL program.",bullets:["Competitively selected for a 10-week virtual research internship at IIT Ropar, working on research tasks under direct faculty supervision.","Conducted research under the direct supervision of Prof. Sudarshan Iyengar, focusing on algorithmic reasoning and computational analysis."],tags:["Research process","Python","Mentorship"]},{org:"Smart India Hackathon 2026 — SkyGuard AI",title:"Team build · ML + platform",kind:"Hackathon",period:"Sep 2026",location:"Problem statement SIH26073 · Ministry of Earth Sciences / IMD",summary:"Real-time anomaly detection for the India Meteorological Department's nationwide network of Automatic Weather Stations.",bullets:["Designed a 4-layer defense architecture instead of naive thresholding: deterministic physical thermodynamics, geospatial barometric consensus across neighbouring stations, a PyTorch LSTM autoencoder, and a Scikit-learn Isolation Forest ensemble.","Kept the inference path under 12 ms per reading by scoring cheap checks first and only escalating to the model layers when the deterministic layers stay inconclusive.","Streamed telemetry through FastAPI WebSockets into a React 18 + TypeScript + Tailwind dashboard, so an operator sees a station go weird while it is going weird.","Validated against Open-Meteo REST feeds and ESP32 edge-hardware telemetry across 35 simulated stations."],tags:["Python","PyTorch","FastAPI","React","TypeScript","WebSockets"],link:{label:"github.com/Salahuddin-13/SkyGuard-AI",href:"https://github.com/Salahuddin-13/SkyGuard-AI"}},{org:"Smart Crop Selector · Smart India Hackathon",title:"Team build · full-stack + data logic",kind:"Hackathon",period:"2025",location:"Team project",summary:"A web prototype that helps farmers pick the crop that actually suits their land, from geographic, soil and climate inputs.",bullets:["Developed a
